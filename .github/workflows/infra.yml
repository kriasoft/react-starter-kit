name: Infrastructure

# Terraform runs on its own cadence, never as part of an application deploy.
# Manual dispatch only: infrastructure changes are rare, and an accidental apply
# is far more expensive than an accidental redeploy.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [staging, production]
        required: true
      apply:
        description: "Apply changes (recomputes the plan; leave off to plan only)"
        type: boolean
        default: false

# Serialise per environment. HCP Terraform locks the workspace as well; this
# just avoids queuing runs that would only wait on that lock.
concurrency:
  group: infra-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  terraform:
    name: ${{ inputs.apply && 'Apply' || 'Plan' }} (${{ inputs.environment }})
    runs-on: ubuntu-latest
    # Selects the GitHub Environment, not the Terraform workspace – that comes
    # from the root's `cloud` block. Where required reviewers are configured
    # this gates the run, including plan-only dispatches: protection rules
    # apply to any job naming an environment.
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infra/envs/${{ inputs.environment }}
    env:
      # The only credential needed: runs execute in HCP, so Cloudflare and
      # database credentials stay workspace variables and never reach GitHub.
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      # Dispatch offers a branch picker, and plans are not the safe half: HCP
      # executes the configuration it is handed in the workspace's privileged
      # run environment, with its variables and state, so planning an unmerged
      # branch runs it against production's credentials – HashiCorp treats plan
      # permission as equivalent to write. Branch-level feedback is
      # `bun infra:check` in ci.yml.
      #
      # This catches the mistake, not an attacker: a dispatch runs the workflow
      # definition from its own ref, so a branch can delete this step. The
      # Environment's deployment-branch rule is the half that enforces.
      - name: Restrict runs to main
        if: ${{ github.ref != 'refs/heads/main' }}
        # The job default points into a repository not yet checked out.
        working-directory: ${{ github.workspace }}
        # Through `env`, never `${{ }}` in the script: expressions are pasted in
        # before the shell parses it, and a branch name may legally contain
        # `$(…)`. As a variable it stays data, in a job holding the HCP token.
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "::error::Infrastructure runs must use main, not ${REF_NAME}."
          exit 1

      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          # Stream Terraform's own output instead of the wrapper's summary.
          terraform_wrapper: false

      - run: terraform init -input=false

      - name: Plan
        if: ${{ !inputs.apply }}
        run: terraform plan -input=false

      # `-auto-approve` is intentional here: the environment gate ran before the
      # job and HCP records the run. But the reviewer approved the job, not a
      # plan they had read – this run computes its own. Dispatch once with apply
      # off, read that plan, then dispatch again.
      - name: Apply
        if: ${{ inputs.apply }}
        run: terraform apply -input=false -auto-approve

      # Hyperdrive IDs are non-secret and belong in apps/api/wrangler.jsonc.
      - name: Hyperdrive bindings
        if: ${{ inputs.apply }}
        run: terraform output -raw wrangler_hyperdrive_bindings >> "$GITHUB_STEP_SUMMARY"
