name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    # Manual runs can deploy only production; staging deploys on merge to main.
    inputs:
      deploy_production:
        description: "Deploy to production after the build"
        type: boolean
        default: false

env:
  HUSKY: 0

# Keyed on the event as well as the ref, so a manual production run and ordinary
# CI on `main` land in different groups. Without that split, merging to main
# mid-deploy cancels the deploy and leaves the three workers on mixed versions.
# Successive PR and push runs still supersede each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # Every run, not just PRs: whether `main` only receives reviewed commits
      # is a branch-protection setting this repository cannot assert, and a
      # deployed commit should meet the same bar however it arrived.
      - run: bun prettier --check .
      - run: bun lint

      # Validates both roots without remote state or provider credentials.
      - uses: hashicorp/setup-terraform@v4
      - run: bun infra:check

      # `apps/api` references `apps/email`, so `tsc --build` emits the template
      # declarations before compiling the code that imports them – and leaves
      # `apps/email/dist` in place for the artifact below.
      - run: bun typecheck
      # tsc cannot parse .astro templates; astro check covers apps/web
      - run: bun --filter @repo/web check

      # Tests
      - run: bun run test -- --run

      # Build all workspaces. The API build targets the container image
      # (apps/api/Dockerfile) – Wrangler bundles `worker.ts` from source – so it
      # runs here as a compile check but is not part of the deploy artifact.
      - run: bun --filter @repo/web build
      - run: bun --filter @repo/api build
      - run: bun --filter @repo/app build

      # Exactly what the deploy job consumes: static assets for the web and app
      # workers, plus the compiled email workspace. `apps/api` deploys from
      # source, and `@repo/email` resolves through `./dist`, so Wrangler cannot
      # bundle the API worker without it on a fresh checkout.
      - uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            apps/email/dist
            apps/web/dist
            apps/app/dist

  deploy-staging:
    name: "Deploy"
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      name: Staging
      environment: staging
      url: https://staging.example.com
    secrets: inherit
    # A called workflow can never hold more than its caller grants, and naming
    # any permission drops the rest to `none` – so `contents: read` has to be
    # repeated here for the checkout inside deploy.yml to work on a private repo.
    permissions:
      contents: read
      deployments: write

  deploy-production:
    name: "Deploy"
    needs: [build]
    # The dispatch UI offers a branch picker, so pin production to `main`
    # rather than trusting whatever ref the run was started from.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy_production &&
      github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      name: Production
      environment: production
      url: https://example.com
    secrets: inherit
    permissions:
      contents: read
      deployments: write
